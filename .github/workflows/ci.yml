name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The CLI and web UI are standard library only; this leg proves that claim.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core only, no dependencies)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m gmail_imap_mcp.cli --help

  mcp:
    # The MCP SDK is the only third-party dependency. Install it here so a
    # broken extra (requires-python, resolver conflicts) fails CI instead of
    # passing on the core-only leg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the MCP extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: MCP server import and tool schema
        run: python -c "from gmail_imap_mcp.server import mcp; print(sorted(t.name for t in mcp._tool_manager.list_tools()))"
